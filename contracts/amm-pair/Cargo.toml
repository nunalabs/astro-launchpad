[package]
name = "amm-pair"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "23.2.1"
astro-core-shared = { git = "https://github.com/nunalabs/astro-core", tag = "v1.3.0" }

[dev-dependencies]
soroban-sdk = { version = "23.2.1", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
