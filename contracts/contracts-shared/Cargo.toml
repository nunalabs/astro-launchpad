[package]
name = "contracts-shared"
version = "1.0.0"
edition = "2021"
rust-version = "1.84"
authors = ["Astro Shiba Team"]
description = "Shared types, interfaces, and utilities for Astro ecosystem contracts"
license = "MIT"

[lib]
crate-type = ["rlib"]
doctest = false

[features]
default = []
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = "22.0.0"

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
