[package]
name = "sac-factory"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"

[workspace]
exclude = ["fuzz"]

[lib]
crate-type = ["cdylib", "rlib"]  # rlib needed for fuzzing

[dependencies]
soroban-sdk = "25.2.0"
astro-core-shared = { git = "https://github.com/nunalabs/astro-core", tag = "v1.5.0" }

[dev-dependencies]
soroban-sdk = { version = "25.2.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
