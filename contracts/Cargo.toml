[workspace]
resolver = "2"

members = [
    "fee-distributor",
    "staking-pool",
    "liquidity-locker",
    "treasury-vault",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Astro Team"]
license = "MIT"

[workspace.dependencies]
soroban-sdk = "22.0.0"
astro-core-shared = { git = "https://github.com/nunalabs/astro-core", tag = "v1.0.2" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
