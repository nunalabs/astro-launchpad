[package]
name = "staking-pool"
version = "1.0.0"
edition = "2021"
description = "Staking pool contract for Astro ecosystem"
authors = ["Astro Team"]

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "22.0.0"
astro-core-shared = { git = "https://github.com/nunalabs/astro-core", tag = "v1.0.2" }

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
